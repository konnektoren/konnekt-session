[package]
name = "konnekt-session-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
output-json = ["cucumber/output-json"]
output-junit = ["cucumber/output-junit"]

[dependencies]
konnekt-session-core = { path = "../konnekt-session-core" }
konnekt-session-p2p = { path = "../konnekt-session-p2p" }
konnekt-session-bevy = { path = "../konnekt-session-bevy" }
konnekt-session-yew = { path = "../konnekt-session-yew" }
konnekt-session-rating = { path = "../konnekt-session-rating" }
cucumber = { version = "0.23" }
tokio = { version = "1.37", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
bevy_app = { workspace = true }
ed25519-dalek = { workspace = true }

# Serialization
serde = { workspace=true }
serde_json = { workspace=true }

[dev-dependencies]
tokio = { version = "1.37", features = ["macros", "rt-multi-thread"] }
matchbox_socket = { workspace = true }
tracing = { workspace = true }

[[test]]
name = "bdd_tests"
harness = false

[[test]]
name = "bdd_bevy"
harness = false

[[test]]
name = "bdd_who_am_i"
harness = false

[[test]]
name = "bdd_synchronization"
harness = false
